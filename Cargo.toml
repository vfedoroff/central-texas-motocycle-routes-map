[workspace]
members = [
    "crates/catalog-model",
    "crates/catalog-roads",
    "crates/catalog-build",
    "crates/catalog-ui",
    "crates/xtask",
    "crates/route-lint",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
geo = { version = "=0.33.1", default-features = false }
rstar = "=0.13.0"
osmpbfreader = "=0.19.1"
zstd = "=0.14.0"
sha2 = "=0.11.0"
url = "=2.5.4"
askama = "=0.16.1"
pulldown-cmark = "=0.13.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
