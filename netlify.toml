# Netlify Configuration for Ride Atlas
[build]
  command = "rustup target add wasm32-unknown-unknown && cargo install trunk --version 0.21.14 --locked && cargo xtask build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.21.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=5184000"
    Access-Control-Allow-Origin = "*"

[[plugins]]
  package = "./plugins/netlify-plugin-social-map-cache"
