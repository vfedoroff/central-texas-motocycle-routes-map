[package]
name = "catalog-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
catalog-model = { path = "../catalog-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.7.7", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
web-sys = { version = "=0.3.77", features = ["Window", "Document", "Location", "History", "Storage", "Element", "HtmlElement", "HtmlInputElement", "NodeList", "KeyboardEvent", "UrlSearchParams", "AbortController", "AbortSignal", "Navigator", "Clipboard"] }
console_error_panic_hook = "=0.1.7"
gloo-net = { version = "=0.6.0", default-features = false, features = ["http"] }
gloo-timers = "=0.3.0"
